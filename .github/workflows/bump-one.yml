name: Bump one package

on:
  workflow_call:
    inputs:
      package:
        required: true
        type: string
      kind:
        required: true
        type: string
      version:
        required: true
        type: string
  # Also dispatchable for a single package. The stale handler below re-dispatches
  # this workflow when upstream releases a newer version mid-bump.
  workflow_dispatch:
    inputs:
      package:
        required: true
        type: string
      kind:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write

jobs:
  bump-one:
    runs-on: macos-latest
    env:
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_DEVELOPER: 1
      PACKAGE: ${{ inputs.package }}
      KIND: ${{ inputs.kind }}
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Configure git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Resolve package info
        id: resolve
        run: |
          set -euo pipefail
          TAP_NAME="${GITHUB_REPOSITORY#*/}"
          TAP="${GITHUB_REPOSITORY_OWNER}/${TAP_NAME#homebrew-}"
          echo "qualified=${TAP}/${PACKAGE}" >> "$GITHUB_OUTPUT"

          if [ "$KIND" = "formula" ]; then
            echo "file=Formula/${PACKAGE}.rb" >> "$GITHUB_OUTPUT"
          else
            echo "file=Casks/${PACKAGE}.rb" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean stale branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          # Delete leftover remote branches from previous failed bump attempts
          for pattern in "bump-${PACKAGE}-${VERSION}" "bump/${PACKAGE}/${VERSION}"; do
            git push origin --delete "$pattern" 2>/dev/null || true
          done
          # Close any open bump PR for this package, regardless of version.
          # The discover job always targets the latest version, so a fresh run
          # supersedes older stragglers (e.g. a 1.22.4 PR left open when we bump
          # to 1.22.5) that would otherwise pile up and go stale against livecheck.
          gh pr list --state open --json number,title \
            -q ".[] | select(.title | startswith(\"${PACKAGE} \")) | .number" | \
            while read -r pr; do
              echo "Closing superseded PR #${pr}"
              gh pr close "$pr" --delete-branch 2>/dev/null || true
            done

      - name: Bump with brew
        id: brew-bump
        continue-on-error: true
        env:
          QUALIFIED: ${{ steps.resolve.outputs.qualified }}
        run: |
          set -uo pipefail

          args=(--no-audit --no-browse --no-fork --version="$VERSION")

          echo "::group::brew bump $QUALIFIED"
          if [ "$KIND" = "formula" ]; then
            output=$(brew bump-formula-pr "${args[@]}" "$QUALIFIED" 2>&1) || rc=$?
          else
            output=$(brew bump-cask-pr "${args[@]}" "$QUALIFIED" 2>&1) || rc=$?
          fi
          echo "$output"
          echo "::endgroup::"

          if [ "${rc:-0}" -ne 0 ]; then
            echo "::warning::brew bump failed (exit ${rc}), will try manual bump"
            exit "$rc"
          fi

          pr_url=$(echo "$output" | grep -oE 'https://github.com/[^/]+/[^/]+/pull/[0-9]+' | head -1)
          if [ -z "$pr_url" ]; then
            echo "::error::brew bump succeeded but could not extract PR URL"
            exit 1
          fi
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Manual bump (fallback)
        if: steps.brew-bump.outcome == 'failure'
        id: manual-bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.resolve.outputs.file }}
        run: |
          set -euo pipefail

          # Clean up any partial state from brew attempt
          git checkout master 2>/dev/null || true
          git clean -fd 2>/dev/null || true

          # Re-set auth after cleanup (brew bump can disrupt git credentials)
          git config "http.https://github.com/.extraheader" \
            "AUTHORIZATION: basic $(echo -n "x-access-token:${GH_TOKEN}" | base64)"

          branch="bump/${PACKAGE}/${VERSION}"

          # Delete stale remote branch from previous failed runs
          git push origin --delete "$branch" 2>/dev/null || true

          git checkout -b "$branch"

          ruby scripts/manual-bump.rb "$FILE" "$VERSION"

          git add "$FILE"
          git commit -m "${PACKAGE} ${VERSION}"
          git push -u origin "$branch"

          pr_url=$(gh pr create \
            --title "${PACKAGE} ${VERSION}" \
            --body "Bump ${PACKAGE} to ${VERSION}" \
            --base master)

          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Test formula
        id: test
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.brew-bump.outputs.pr_url || steps.manual-bump.outputs.pr_url }}
          QUALIFIED: ${{ steps.resolve.outputs.qualified }}
        run: |
          set -uo pipefail

          pr_number=$(echo "$PR_URL" | grep -oE '[0-9]+$')
          head_sha=$(gh pr view "$pr_number" --json headRefOid -q .headRefOid)
          pr_branch=$(gh pr view "$pr_number" --json headRefName -q .headRefName)

          # Ensure we're on the PR branch so brew reads the updated formula
          git fetch origin "$pr_branch"
          git checkout "$pr_branch"

          conclusion="success"
          summary=""

          # Problems we don't treat as real failures:
          #   - "differs from ... retrieved by livecheck": upstream shipped a newer
          #     release after discover picked this version (handled by re-bump below).
          #   - "redundant with version scanned from URL": the tap keeps an explicit
          #     `version` as the single source of truth for the interpolated URLs.
          audit_real_problems() {
            echo "$1" | grep -E '^[[:space:]]+[-*] ' | \
              grep -vE 'differs from .+ retrieved by livecheck' | \
              grep -vE 'redundant with version scanned from URL' || true
          }

          # Audit the tap-qualified name so it can't resolve to a same-named package
          # in homebrew-core/cask (e.g. calendr, aseprite also exist upstream).
          # brew audit --online checks URLs which can fail transiently, so retry once
          # (but only when there are real problems; a stale-version diff won't heal).
          echo "::group::brew audit"
          audit_output=$(brew audit --online --git --skip-style "$QUALIFIED" 2>&1) || true
          echo "$audit_output"
          if [ -n "$(audit_real_problems "$audit_output")" ]; then
            echo "::warning::brew audit failed, retrying in 10s..."
            sleep 10
            audit_output=$(brew audit --online --git --skip-style "$QUALIFIED" 2>&1) || true
            echo "$audit_output"
          fi
          echo "::endgroup::"

          if [ -n "$(audit_real_problems "$audit_output")" ]; then
            conclusion="failure"
            summary="brew audit failed"
          fi

          # Stale: close this PR and dispatch a fresh bump at the newer version.
          # No point running style on a PR we're about to discard.
          if [ "$conclusion" = "success" ] && \
             echo "$audit_output" | grep -qE 'differs from .+ retrieved by livecheck'; then
            new_version=$(echo "$audit_output" \
              | grep -oE "differs from '[^']+' retrieved by livecheck" \
              | head -1 | sed -E "s/.*from '([^']+)'.*/\1/")
            echo "::warning::${PACKAGE} ${VERSION} is stale; upstream is at ${new_version}."
            gh pr close "$pr_number" --comment "Superseded: upstream released ${new_version}." --delete-branch 2>/dev/null || true
            if [ -n "$new_version" ] && [ "$new_version" != "$VERSION" ]; then
              gh workflow run bump-one.yml \
                -f package="$PACKAGE" -f kind="$KIND" -f version="$new_version"
              echo "::notice::Dispatched fresh bump for ${PACKAGE} ${new_version}"
            fi
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # brew style blocks the bump: style must not degrade on master.
          echo "::group::brew style"
          if ! style_output=$(brew style "$QUALIFIED" 2>&1); then
            conclusion="failure"
            summary="${summary:+$summary; }brew style failed"
          fi
          echo "$style_output"
          echo "::endgroup::"

          [ "$conclusion" = "success" ] && summary="All checks passed"

          # Post commit status so branch protection is satisfied
          [ "$conclusion" = "success" ] && state="success" || state="failure"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/$head_sha" \
            --method POST \
            -f state="$state" \
            -f context="test" \
            -f description="$summary for $PACKAGE $VERSION"

          if [ "$conclusion" = "failure" ]; then
            echo "::error::Tests failed: $summary"
            exit 1
          fi

      - name: Enable auto-merge
        if: steps.test.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.brew-bump.outputs.pr_url || steps.manual-bump.outputs.pr_url }}
        run: |
          set -euo pipefail
          echo "Enabling auto-merge for $PR_URL"
          gh pr merge "$PR_URL" --auto --squash --delete-branch
