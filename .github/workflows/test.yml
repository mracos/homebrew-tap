name: Tests

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  audit:
    # Formulae audit fine on Linux; casks read Info.plist via `plutil` (macOS-only),
    # so route each kind to the cheapest runner that can audit it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: formula
            dir: Formula
            os: ubuntu-latest
          - kind: cask
            dir: Casks
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        id: cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Homebrew Bundler RubyGems
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install-bundler-gems

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            ${{ matrix.dir }}/**

      - name: Run brew audit
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tap-qualified so a bare name can't resolve to a same-named package in
          # homebrew-core/cask (e.g. calendr, aseprite also exist upstream).
          tap="${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY##*/homebrew-}"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            name=$(basename "$file" .rb)
            echo "Auditing $tap/$name (from $file)"
            if ! out=$(brew audit --online --git --skip-style "$tap/$name" 2>&1); then
              echo "$out"
              # Ignorable audit nits:
              # - "redundant version": the tap keeps an explicit `version` as the
              #   single source of truth for its interpolated URLs.
              # - ftpmirror.gnu.org unreachable: the GNU redirector proxies to a
              #   random mirror per request and intermittently returns 502. brew
              #   itself skips online checks for ftp.gnu.org (brew#20456); the
              #   "Validate download URLs" step below still curls the URL with
              #   retries, so a genuinely dead URL is caught there.
              real=$(echo "$out" | grep -E '^[[:space:]]+[-*] ' \
                | grep -vE 'redundant with version scanned from URL' \
                | grep -vE 'The source URL https://ftpmirror\.gnu\.org/.* is not reachable' || true)
              [ -n "$real" ] && exit 1
              echo "::notice::$name: only ignorable problems reported (redundant version / ftpmirror flake)"
            fi
          done

      - name: Run brew style
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          tap="${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY##*/homebrew-}"
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            name=$(basename "$file" .rb)
            echo "Checking style for $tap/$name (from $file)"
            brew style "$tap/$name" || exit 1
          done

      - name: Validate download URLs
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            echo "Validating URLs in $file"
            # Extract URLs from the file and check if they're accessible
            urls=$(grep -oE "url ['\"]https?://[^'\"]+['\"]" "$file" | sed -E "s/url ['\"]([^'\"]+)['\"]/\\1/")
            for url in $urls; do
              # Skip URLs with Ruby interpolation (e.g., #{variable})
              # Using simplified pattern '#\{' instead of '#\{[^}]+\}' for better shell compatibility
              if echo "$url" | grep -qE '#\{'; then
                echo "Skipping $url (contains Ruby interpolation)"
                continue
              fi
              echo "Checking $url"
              # --retry rides out transient 5xx from mirror redirectors
              # (ftpmirror.gnu.org 502s intermittently) but still fails hard
              # on 404s, so wrong URLs are caught.
              if ! curl --output /dev/null --silent --head --fail --retry 5 "$url"; then
                echo "Error: URL $url is not accessible"
                exit 1
              fi
            done
          done

  # Stable required-check gate: branch protection requires "test", and bump-one.yml
  # posts a "test" commit status to match. Keep a single job named `test` that only
  # passes when both audit legs pass, regardless of which kinds a PR actually touched.
  test:
    needs: audit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on audit result
        run: |
          if [ "${{ needs.audit.result }}" != "success" ]; then
            echo "audit did not succeed: ${{ needs.audit.result }}"
            exit 1
          fi
          echo "All audit legs passed"
